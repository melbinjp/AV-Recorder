<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video Recorder</title>
    <link rel="stylesheet" href="style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

</head>
<body>
    <div class="container">
        <h1>Audio-Video Recorder</h1>
        <div class="controls">
            <button id="startMic" class="button">Start Recording Microphone</button>
            <button id="stopMic" class="button" disabled>Stop Recording Microphone</button>
            <button id="startSystem" class="button">Start Screen recording</button>
            <button id="stopSystem" class="button" disabled>Stop Screen System</button>
            <button id="startScreenAndMic" class="button">Start Screen & Mic Recording</button>
            <button id="stopScreenAndMic" class="button" disabled>Stop Screen & Mic Recording</button>
        </div>
        <div class="status-container">
            <span id="status" class="status"></span>
        </div>
        <div id="checklist" class="checklist"></div>
        <div id="log" class="log"></div>
    </div>
    <script src="src/main.js" type="module"></script>
</body>
</html>
